<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cmd@Lautz97</title>
    <link rel="stylesheet" type="text/css" media="screen" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/doodle/96/000000/console--v2.png" />
</head>

<body>
    <div id="terminal">
        <a id="before"></a>
    </div>
    <div id="command" onclick="$('texter').focus();">
        <textarea type="text" id="texter" onkeyup="typeCharacter(this, event)" onkeydown="typeCharacter(this, event); 
        moveCursor(this.value.length, event)" onkeypress="typeCharacter(this, event);" autofocus></textarea>
        <div id="liner">
            <span id="typer"></span><b class="cursor" id="cursor">█</b>
        </div>
    </div>
    <script src="js/caret.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/main.js"></script>
    <script src="js/utils.js"></script>
</body>

</html>
