<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Davide 'Lautz97' Lauterio - game developer. An interactive terminal with projects and contacts." />
    <title>cmd@Lautz97</title>
    <link rel="stylesheet" type="text/css" media="screen" href="css/style.css" />
    <link rel="icon" type="image/png" href="https://img.icons8.com/doodle/96/000000/console--v2.png" />
</head>

<body>
    <noscript>
        <p>This site is an interactive terminal and needs JavaScript.</p>
        <p>Find me on <a href="https://github.com/Lautz97">GitHub</a>, <a href="https://www.linkedin.com/in/lautz97">LinkedIn</a>
            or <a href="https://t.me/lautz97">Telegram</a>.</p>
    </noscript>
    <div id="terminal" role="log" aria-live="polite">
        <a id="before"></a>
    </div>
    <div id="command" onclick="$('texter').focus();">
        <textarea id="texter" aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" onkeyup="typeCharacter(this, event)" onkeydown="typeCharacter(this, event); 
        moveCursor(this.value.length, event)" onkeypress="typeCharacter(this, event);" autofocus></textarea>
        <div id="liner">
            <span id="typer"></span><b class="cursor" id="cursor" aria-hidden="true">█</b>
        </div>
    </div>
    <script src="js/caret.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/main.js"></script>
    <script src="js/utils.js"></script>
</body>

</html>
